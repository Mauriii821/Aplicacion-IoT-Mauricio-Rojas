apply plugin: 'com.android.application'

// Las credenciales se leen desde local.properties (NO se sube a GitHub)
def secretos = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) archivoLocal.withInputStream { secretos.load(it) }
def secreto = { String clave, String porDefecto -> "\"" + secretos.getProperty(clave, porDefecto) + "\"" }

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.example.webservicessencillo"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 2
        versionName "2.0-unidad3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "URL_WEB_SERVICES", secreto('api.url', 'https://172.20.10.2:5000/')
        buildConfigField "String", "DEVICE_ID", secreto('device.id', 'raspbian01')
    }
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled true   // ofusca el código del APK final
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.example.webservicessencillo'
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.8.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'com.android.volley:volley:1.2.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
