# Configuración del broker Mosquitto para el proyecto IoT (TI3042)
# Se instala en /etc/mosquitto/conf.d/iot.conf (lo hace instalar_broker.sh)

# --- Autenticación: nadie entra sin usuario y contraseña ---
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd

# --- Autorización: cada usuario solo usa sus tópicos (mínimo privilegio) ---
acl_file /etc/mosquitto/acl

# --- Cifrado: solo MQTT sobre TLS (puerto 8883). No hay puerto 1883 sin cifrar ---
listener 8883
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile  /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# --- Disponibilidad ---
max_connections 50
max_keepalive 120
